apiVersion: v1
kind: Namespace
metadata:
  name: demo-apps
---
# Disposable local-demo credentials, shared with checkout.
apiVersion: v1
kind: Secret
metadata:
  name: checkout-database
  namespace: demo-apps
type: Opaque
stringData:
  username: checkout
  password: checkout-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: demo-apps
data:
  init.sql: |
    CREATE TABLE products (
      id BIGINT PRIMARY KEY,
      name VARCHAR(255) NOT NULL
    );
    INSERT INTO products (id, name) VALUES (1, 'Demo product');
    CREATE TABLE checkout_orders (
      id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      product_id BIGINT NOT NULL REFERENCES products(id),
      total INTEGER NOT NULL
    );
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: demo-apps
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: demo-apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: demo-apps
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
          env:
            - {name: POSTGRES_DB, value: checkout}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: checkout-database, key: username}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: checkout-database, key: password}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          # TCP is unavailable on the temporary init server: wait for SQL seeding.
          startupProbe:
            exec:
              command: [pg_isready, -h, "127.0.0.1", -U, checkout, -d, checkout]
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [pg_isready, -h, "127.0.0.1", -U, checkout, -d, checkout]
            periodSeconds: 2
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
        - name: init
          configMap: {name: postgres-init}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: demo-apps
spec:
  selector: {app: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
