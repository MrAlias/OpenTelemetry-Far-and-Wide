        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: demo-apps
    spec:
      containers:
        - name: gateway
          image: far-wide-demo-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
---
