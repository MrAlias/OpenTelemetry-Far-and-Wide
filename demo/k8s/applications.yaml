---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: demo-apps
spec:
  replicas: 1
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: checkout}
  template:
    metadata:
      labels:
        app: checkout
        app.kubernetes.io/name: checkout
        app.kubernetes.io/part-of: demo-apps
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: checkout
          image: far-wide-demo-checkout:local
          imagePullPolicy: IfNotPresent
          env:
            # Remove this stale optional setting to skip the retired backend.
            - name: LEGACY_PRICING_URL
              value: http://192.0.2.42:8080/price
            - name: COMMERCE_SERVICES
              value: cart,shipping,payments,notifications
            - name: DATABASE_URL
              value: jdbc:postgresql://postgres:5432/checkout
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef: {name: checkout-database, key: username}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: {name: checkout-database, key: password}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 2
          # Let endpoint updates reach kube-proxy before the JVM stops.
          lifecycle:
            preStop:
              exec:
                command: [sh, -c, sleep 5]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: demo-apps
spec:
  selector: {app: checkout}
  ports:
    - {name: http, port: 8080, targetPort: http}
