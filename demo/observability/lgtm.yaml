# Demo backend based on grafana/docker-otel-lgtm v0.37.0.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lgtm-data
  namespace: observability
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  namespace: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: demo-lgtm
  template:
    metadata:
      labels:
        app: demo-lgtm
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      automountServiceAccountToken: false
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.37.0@sha256:57b5ab1ca6619beb180174e2fccce04762470750669d043f544b4726d0582d07
          ports:
            - {name: grafana, containerPort: 3000}
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
          env:
            - {name: ENABLE_OBI, value: "false"}
            - {name: LGTM_READY_FILE, value: /data/lgtm-ready}
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {memory: 3Gi}
          # Check the backends as well as Grafana: a working UI alone is not ready.
          startupProbe:
            exec: &health
              command:
                - /bin/bash
                - -ec
                - |
                  for url in \
                    http://127.0.0.1:3000/api/health \
                    http://127.0.0.1:3100/ready \
                    http://127.0.0.1:3200/ready \
                    http://127.0.0.1:9090/-/ready \
                    http://127.0.0.1:4040/ready \
                    http://127.0.0.1:13133/ready; do
                    curl --fail --silent --show-error --max-time 2 "$url" >/dev/null
                  done
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 30
          readinessProbe:
            exec: *health
            periodSeconds: 10
            timeoutSeconds: 15
          livenessProbe:
            exec: *health
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lgtm-data
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm
  namespace: observability
spec:
  selector:
    app: demo-lgtm
  ports:
    - {name: grafana, port: 3000, targetPort: grafana}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
