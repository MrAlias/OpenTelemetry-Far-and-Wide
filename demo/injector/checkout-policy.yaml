# Candidate configuration for the pinned Grafana prototype, not the released
# Operator. See docs/technical-findings.md, "Injector prototype evaluation".
# Images must be built and loaded into the separate evaluation cluster first.
# Start in breadth: skip injects no volumes or agent. Changing this rule to
# install_unless_conflict affects NEW pods; the handoff runner must roll checkout.
apiVersion: instrumentation.opentelemetry.io/v2alpha1
kind: Instrumentation
metadata:
  name: far-wide-checkout-depth
spec:
  priority: 10
  injector: far-wide-injector:773ffafa
  java: far-wide-injector-java:2.30.0
  defaults:
    # The proof runner must own retirement. The prototype's automatic rollback
    # has a documented informer-cache race and does not coordinate export drain.
    rollback:
      enabled: false
  rules:
  - name: checkout-depth
    selector:
      namespaces: [far-wide-proof]
      podLabels:
        app: checkout
      containerNames: [checkout]
    config:
      mode: skip
      env:
      - name: OTEL_SERVICE_NAME
        value: checkout
      - name: OTEL_RESOURCE_ATTRIBUTES
        value: service.namespace=far-wide-proof
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://collector.far-wide-proof.svc.cluster.local:4318
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      - name: OTEL_PROPAGATORS
        value: tracecontext
      - name: OTEL_TRACES_SAMPLER
        value: parentbased_traceidratio
      - name: OTEL_TRACES_SAMPLER_ARG
        value: '1'
      - name: OTEL_METRICS_EXPORTER
        value: none
      - name: OTEL_LOGS_EXPORTER
        value: none
      - name: OTEL_BSP_SCHEDULE_DELAY
        value: '1000'
      - name: OTEL_INSTRUMENTATION_METHODS_INCLUDE
        value: demo.checkout.PricingEngine[calculate]
