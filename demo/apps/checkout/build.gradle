plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.hibernate.orm:hibernate-core:6.6.59.Final'
    implementation 'org.hibernate.orm:hibernate-hikaricp:6.6.59.Final'
    runtimeOnly 'org.postgresql:postgresql:42.7.14'
}

application {
    mainClass = 'demo.checkout.Checkout'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
