apiVersion: v1
kind: Namespace
metadata:
  name: otel-injector-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-injector
  namespace: otel-injector-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-demo-injector
rules:
  - apiGroups: [demo.opentelemetry.io]
    resources: [instrumentations, instrumentations/status, instrumentations/finalizers]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods, nodes]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [pods]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-demo-injector
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: otel-demo-injector}
subjects:
  - kind: ServiceAccount
    name: otel-injector
    namespace: otel-injector-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: volume-probes
  namespace: otel-injector-system
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: volume-probes
  namespace: otel-injector-system
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: volume-probes}
subjects:
  - kind: ServiceAccount
    name: otel-injector
    namespace: otel-injector-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-injector
  namespace: otel-injector-system
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: otel-demo-injector}
  template:
    metadata:
      labels: {app: otel-demo-injector}
    spec:
      serviceAccountName: otel-injector
      nodeSelector: {kubernetes.io/os: linux}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: operator
          image: otel-injector-operator:demo
          imagePullPolicy: IfNotPresent
          ports:
            - {name: webhook, containerPort: 9443}
            - {name: health, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: otel-injector-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-injector
  namespace: otel-injector-system
spec:
  selector: {app: otel-demo-injector}
  ports:
    - {name: https, port: 443, targetPort: webhook}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: otel-demo-injector
webhooks:
  - name: pods.demo.opentelemetry.io
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 10
    reinvocationPolicy: IfNeeded
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [otel-injector-system]
    clientConfig:
      service:
        namespace: otel-injector-system
        name: otel-injector
        path: /mutate
      caBundle: REPLACE_CA_BUNDLE
    rules:
      - operations: [CREATE]
        apiGroups: ['']
        apiVersions: [v1]
        resources: [pods]
        scope: Namespaced
